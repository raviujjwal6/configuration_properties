spring:
    application:
        name: employee-service

    datasource:
        url: jdbc:mysql://localhost:3306/student_db?createDatabaseIfNotExist=true
        username: root
        password: root
        driver-class-name: com.mysql.cj.jdbc.Driver

    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true
        properties:
            hibernate:
                format_sql: true
    config:
        import:
            - optional:configserver:http://localhost:9093
management:
    endpoints:
        web:
            exposure:
                include:
                    - refresh
